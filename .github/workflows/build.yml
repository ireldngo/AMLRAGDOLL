
name: Build AMLRagdoll ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find installed Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"
          NDK_DIR=$(find "$ANDROID_HOME/ndk" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir project
          unzip -q AMLRagdoll3_Project_fixed.zip -d project

      - name: Build ARM64
        run: |
          cd project
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AMLRagdoll-ARM64
          path: project/libs/arm64-v8a/*.so
          
